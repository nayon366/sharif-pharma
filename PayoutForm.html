<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>টাকা পেইড এন্ট্রি</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            color: #333;
        }
        .container {
            background-color: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 450px;
            margin-top: 30px;
        }
        .header {
            text-align: center;
            margin-bottom: 25px;
        }
        .header h2 {
            color: #34495e;
            font-size: 24px;
            margin-top: 10px;
            margin-bottom: 5px;
        }
        .back-button {
            display: flex;
            align-items: center;
            text-decoration: none;
            color: #007bff;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .back-button svg {
            margin-right: 8px;
        }
        label {
            display: block;
            text-align: left;
            margin-bottom: 8px;
            font-weight: bold;
            color: #555;
            margin-top: 15px;
        }
        input[type="number"],
        select {
            width: 100%;
            padding: 12px;
            margin-bottom: 5px;
            border: 1px solid #ced4da;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box; /* ফিক্সড: যেন বক্সের বাইরে না যায় */
            transition: border-color 0.2s;
        }
        input[type="number"]:focus,
        select:focus {
            border-color: #007bff;
            outline: none;
        }
        button {
            background-color: #f77f00;
            color: white;
            padding: 15px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-size: 18px;
            font-weight: bold;
            transition: background-color 0.2s;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            margin-top: 25px;
        }
        button:hover {
            background-color: #e06a00;
        }
        #statusMessage {
            margin-top: 25px;
            font-weight: bold;
            font-size: 16px;
            text-align: center;
        }
        .status-icon {
            margin-left: 8px;
            vertical-align: middle;
            font-size: 1.2em;
        }
    </style>
</head>
<body>

<div class="container">
    <a href="daily_collection_entry.html" class="back-button">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        Details Page এ ফিরে যান
    </a>

    <div class="header">
        <h2>💰 টাকা পেইড এন্ট্রি</h2>
    </div>

    <label for="groupSelect">Group নির্বাচন করুন</label>
    <select id="groupSelect" required>
        <option value="">-- Group --</option>
        <option value="gb-12">gb-12</option>
        <option value="gb-13">gb-13</option> <option value="gb-22">gb-22</option>
        <option value="gb-23">gb-23</option>
    </select>
    
    <label for="payoutAmount">Payout Amount (টাকা)</label>
    <input type="number" id="payoutAmount" placeholder="টাকার পরিমাণ লিখুন" required>

    <button onclick="submitPayoutData()">সেভ করুন (SAVE)</button>
    
    <p id="statusMessage"></p>
</div>

<script>
// ⚠️ আপনার বর্তমান Apps Script URL
const APP_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxPJVZ4dLyu5GmvqKM3A1UErYN1fflEX1c3XgZtEY2-aBxBG0AI8wG8d4iGBOatxJE/exec'; 
const QUEUE_KEY = 'payoutQueue_v2'; // কি পরিবর্তন করা হয়েছে যাতে পুরনো ডাটার সাথে না মিশে

function submitPayoutData() {
    const groupElement = document.getElementById('groupSelect');
    const amountElement = document.getElementById('payoutAmount');
    const status = document.getElementById('statusMessage');

    const group = groupElement.value;
    const amount = amountElement.value;

    if (!group || !amount) {
        status.innerHTML = "দয়া করে গ্রুপ এবং টাকা দুটোই দিন। <span class='status-icon'>❌</span>";
        status.style.color = 'red';
        return;
    }
    
    const data = {
        'action': 'submit', 
        'Group Name': group,
        'taka': amount,     
        'timestamp': new Date().toLocaleString('bn-BD')
    };
    
    // ইনপুট রিসেট
    groupElement.value = '';
    amountElement.value = '';
    
    if (navigator.onLine) {
        sendDataToAppsScript(data, status);
    } else {
        saveDataOffline(data, status);
    }
}

async function sendDataToAppsScript(data, statusElement) {
    statusElement.innerHTML = 'অনলাইনে সেভ হচ্ছে... ⏳';
    statusElement.style.color = 'orange';

    try {
        await fetch(APP_SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors', 
            body: JSON.stringify(data)
        });

        statusElement.innerHTML = '✅ সফলভাবে সেভ হয়েছে! <span class="status-icon">🚀</span>';
        statusElement.style.color = 'green';

    } catch (error) {
        saveDataOffline(data, statusElement);
    }
}

function saveDataOffline(data, statusElement) {
    try {
        const queue = JSON.parse(localStorage.getItem(QUEUE_KEY) || '[]');
        queue.push(data);
        localStorage.setItem(QUEUE_KEY, JSON.stringify(queue));
        
        statusElement.innerHTML = '✅ অফলাইনে সেভ হয়েছে! ইন্টারনেট পেলে সিঙ্ক হবে। <span class="status-icon">💾</span>'; 
        statusElement.style.color = 'blue';
    } catch (e) {
        statusElement.innerHTML = '❌ ত্রুটি: সেভ করা যায়নি।';
        statusElement.style.color = 'red';
    }
}

// ইন্টারনেট আসলে অটো সিঙ্ক
window.addEventListener('online', () => {
    const queue = JSON.parse(localStorage.getItem(QUEUE_KEY) || '[]');
    if (queue.length > 0) {
        queue.forEach(data => sendDataToAppsScript(data, document.getElementById('statusMessage')));
        localStorage.removeItem(QUEUE_KEY);
    }
});
</script>

</body>
</html>

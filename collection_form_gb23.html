<script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("service-worker.js");
    }
    </script>

    <script>
        // 📌 গুরুত্বপূর্ণ: আপনার Apps Script URL এখানে ব্যবহার করুন
        const GOOGLE_SHEET_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzt0DJEVTlPKuCddNOzSbzs1PNuF3bT_-98zyDW_a1jGaHesAUbbt16rHjCkm64d3pR/exec"; 
        
        const form = document.getElementById('collectionForm');
        const customerNameInput = document.getElementById('customerName');
        const submitButton = document.getElementById('submitButton');
        const statusMessage = document.getElementById('statusMessage');
        const networkStatus = document.getElementById('networkStatus');
        const datalist = document.getElementById('customer-list-gb23');
        const OFFLINE_STORAGE_KEY = 'offlineSubmissions_GB23'; 
        const CUSTOMER_LIST_KEY = 'savedCustomerList_GB23';
        const MAX_SUBMISSIONS = 50; // সর্বোচ্চ অফলাইন স্টোরেজ

        // --- কাস্টমার লিস্ট লোড করা ---
        async function fetchCustomerList() {
            customerNameInput.placeholder = 'Loading list...';
            try {
                // আমরা ধরে নিচ্ছি customer_list.json আপনার Apps Script থেকে আসে না, সরাসরি সার্ভারে আছে
                const response = await fetch('customer_list.json'); 
                if (!response.ok) { throw new Error('customer_list.json failed to load.'); }

                const fullData = await response.json();
                const gb23_customers = fullData.customers_gb23 || []; 
                
                populateDatalist(gb23_customers);
                localStorage.setItem(CUSTOMER_LIST_KEY, JSON.stringify(gb23_customers)); // লোকাল ক্যাশ
                
                customerNameInput.disabled = false;
                customerNameInput.placeholder = 'Type or select customer name';
                return gb23_customers;

            } catch (error) {
                console.error("Failed to fetch customer list from JSON:", error);
                // লোকাল ক্যাশ থেকে লোড করার চেষ্টা
                const offlineList = JSON.parse(localStorage.getItem(CUSTOMER_LIST_KEY) || '[]');
                populateDatalist(offlineList);
                
                customerNameInput.disabled = false;
                customerNameInput.placeholder = offlineList.length > 0 ? 'Offline list loaded. Type' : 'Offline list load failed. Type manually.';
                return offlineList;
            }
        }

        // --- Helper Functions (Simplified) ---
        function populateDatalist(list) {
            let optionsHTML = '';
            list.forEach(customer => {
                optionsHTML += `<option value="${customer}">`;
            });
            datalist.innerHTML = optionsHTML;
        }
        
        // --- Network Status Checker & UI Update ---
        function updateNetworkStatus() {
            const submissions = JSON.parse(localStorage.getItem(OFFLINE_STORAGE_KEY) || '[]');
            const syncCount = submissions.length;
            
            let statusHTML = '';
            if (!navigator.onLine) {
                statusHTML += '<span class="offline-badge">অফলাইনে আছেন</span>';
                submitButton.textContent = 'OFFLINE SAVE'; 
                submitButton.style.backgroundColor = 'var(--danger-color)';
            } else {
                submitButton.textContent = 'SAVE'; 
                submitButton.style.backgroundColor = 'var(--primary-color)';
            }
            if (syncCount > 0) {
                statusHTML += `<span class="sync-count">Pending Sync: ${syncCount}</span>`; 
            }
            networkStatus.innerHTML = statusHTML;
            
            if (navigator.onLine && syncCount > 0) {
                // syncData() কলটি syncData() ফাংশনের মধ্যে পরিচালনা করা হবে
            } else if (navigator.onLine && syncCount === 0) {
                // কোনো মেসেজ না দিয়ে syncData() কল করুন যাতে নিশ্চিত হওয়া যায় যে সব ডেটা সেভ হয়েছে
            } 
        }

        window.addEventListener('online', updateNetworkStatus);
        window.addEventListener('offline', updateNetworkStatus);
        
        document.addEventListener('DOMContentLoaded', () => {
            fetchCustomerList(); 
            updateNetworkStatus();
            // পেজ লোডের সময় সিঙ্ক শুরু করা
            if (navigator.onLine) { syncData(); } 
        });
        
        // --- Core Functions ---

        // এই ফাংশনটি এখন syncData() এর মধ্যে ব্যবহৃত হবে
        async function submitToGoogleSheet(data) {
            try {
                // Apps Script Response Body Check করার জন্য mode: 'cors' ব্যবহার করা উচিত
                const response = await fetch(GOOGLE_SHEET_WEB_APP_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                
                // শুধুমাত্র response.ok হলেই সফল ধরা হবে
                return response.ok;
                
            } catch (error) {
                console.error('Submission Error:', error);
                return false; 
            }
        }
        
        // --- saveToLocalStorage (Immediate Feedback) ---
        function saveToLocalStorage(data) {
            let submissions = JSON.parse(localStorage.getItem(OFFLINE_STORAGE_KEY) || '[]');
            
            if (submissions.length >= MAX_SUBMISSIONS) {
                statusMessage.style.backgroundColor = 'var(--danger-color)';
                statusMessage.style.color = 'white';
                statusMessage.textContent = 'Error: Max offline limit reached!';
                return;
            }

            submissions.push(data);
            localStorage.setItem(OFFLINE_STORAGE_KEY, JSON.stringify(submissions));
            
            // ব্যাকগ্রাউন্ড সিঙ্ক করার অনুরোধ
            if ('sync' in navigator.serviceWorker) {
                navigator.serviceWorker.ready.then(registration => {
                    registration.sync.register('sync-offline-submissions')
                        .then(() => { console.log('Background sync registered successfully.'); })
                        .catch(error => { console.error('Background sync registration failed:', error); });
                });
            }
            
            statusMessage.style.backgroundColor = 'var(--success-color)';
            statusMessage.style.color = 'white';
            statusMessage.textContent = `Success! Saved locally. (${submissions.length} pending sync)`; 
            form.reset();
            updateNetworkStatus();
            
            // যদি ইন্টারনেট থাকে, তবে সাথে সাথেই সিঙ্ক শুরু করুন
            if (navigator.onLine) { syncData(); }
        }

        // --- syncData (Background/Foreground Sync) ---
        async function syncData() {
            const submissions = JSON.parse(localStorage.getItem(OFFLINE_STORAGE_KEY) || '[]');
            if (submissions.length === 0) {
                statusMessage.textContent = statusMessage.textContent.startsWith('Success') ? statusMessage.textContent : 'All up to date ✅'; 
                updateNetworkStatus();
                return;
            }

            // সিঙ্ক শুরু হচ্ছে মেসেজ
            statusMessage.style.backgroundColor = 'var(--warning-color)';
            statusMessage.style.color = 'var(--text-color)';
            statusMessage.textContent = `Syncing: ${submissions.length} pending entries...`; 
            submitButton.disabled = true;

            let failedSubmissions = [];
            for (const data of submissions) {
                const success = await submitToGoogleSheet(data); 
                
                if (!success) { failedSubmissions.push(data); }
            }
            
            if (failedSubmissions.length === 0) {
                localStorage.removeItem(OFFLINE_STORAGE_KEY);
                statusMessage.style.backgroundColor = 'var(--success-color)';
                statusMessage.style.color = 'white';
                statusMessage.textContent = 'Successfully synced all data! ✅'; 
                fetchCustomerList(); 
            } else {
                localStorage.setItem(OFFLINE_STORAGE_KEY, JSON.stringify(failedSubmissions));
                statusMessage.style.backgroundColor = 'var(--danger-color)';
                statusMessage.style.color = 'white';
                statusMessage.textContent = `Sync failed: ${failedSubmissions.length} entries remaining. Will retry.`; 
            }
            
            submitButton.disabled = false;
            updateNetworkStatus();
        }

        // --- Data Submission Logic (OFFLINE FIRST) ---
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const formData = new FormData(form);
            const data = {};
            formData.forEach((value, key) => { data[key] = value.trim(); });
            
            // ডেটা ফর্মেট করা
            data.action = 'submit'; 
            // Apps Script-এ সঠিক ডেট ফরম্যাটের জন্য
            data['Submission_Date'] = new Date().toISOString().split('T')[0]; 
            data['Submission_Time'] = new Date().toLocaleTimeString('en-US', { hour12: false }); 
            data['Group'] = 'gb-23'; 

            // 📌 নতুন লজিক: ইন্টারনেট থাকুক বা না থাকুক, প্রথমে Local Storage-এ সেভ হবে।
            saveToLocalStorage(data); 
        });
        
        // --- Service Worker Message Listener ---
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.addEventListener('message', event => {
                if (event.data.type === 'START_SYNC') {
                    console.log("Message received from SW: Initiating sync...");
                    if (navigator.onLine) { syncData(); }
                }
            });
        }
    </script>

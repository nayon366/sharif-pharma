<!DOCTYPE html>
<html>
<head>
    <base target="_top">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>GB-23 Daily Collection Entry</title>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f7f6;
            color: #333;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        .header {
            text-align: center;
            padding: 10px 0 20px 0;
            border-bottom: 1px solid #ddd;
        }
        .header h1 {
            color: #007bff;
            font-size: 24px;
            margin: 5px 0;
        }
        .header .status {
            font-size: 14px;
            color: green;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="text"], input[type="number"], input[type="date"] {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
        }
        .button-save {
            width: 100%;
            padding: 15px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 20px;
            transition: background-color 0.3s;
        }
        .button-save:hover {
            background-color: #0056b3;
        }
        .sync-info {
            background-color: #ffc107;
            color: #333;
            padding: 10px;
            border-radius: 4px;
            text-align: center;
            margin-bottom: 20px;
            font-weight: bold;
            display: none; /* প্রাথমিকভাবে লুকানো থাকবে */
        }
        .sync-error {
            background-color: #dc3545;
            color: white;
            padding: 10px;
            border-radius: 4px;
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
            display: none;
        }
        .success-message {
            background-color: #28a745;
            color: white;
            padding: 10px;
            border-radius: 4px;
            text-align: center;
            margin-top: 15px;
            display: none;
        }
        .back-link {
            display: block;
            margin-bottom: 20px;
            color: #007bff;
            text-decoration: none;
            font-size: 14px;
        }
        .back-link:hover {
            text-decoration: underline;
        }
        .loading-spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border-left-color: #fff;
            animation: spin 1s ease infinite;
            margin: 0 auto;
            display: none;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div class="container">

    <a href="#" class="back-link" onclick="window.history.back(); return false;">← Details Page এ ফিরে যান</a>
    
    <div class="header">
        <span style="font-size: 30px; margin-right: 10px;">💰</span>
        <h1>GB-23 Daily Collection Entry</h1>
        <div id="online-status" class="status">অনলাইনে আছেন</div>
        <div id="pending-sync-status" class="sync-info">Pending Sync: 0</div>
    </div>
    
    <form id="collection-form">
        <input type="hidden" id="submission-date" name="Submission_Date">
        
        <div class="form-group">
            <label for="customer-name">Client/Customer Name</label>
            <input type="text" id="customer-name" name="Client/Customer Name" placeholder="Type or select customer name" list="customer-list" required>
            <datalist id="customer-list"></datalist>
        </div>

        <div class="form-group">
            <label for="payment-received">Payment Received (Taka)</label>
            <input type="number" id="payment-received" name="Payment Received (Taka)" placeholder="e.g. 3000" min="0" required>
        </div>
        
        <div class="form-group">
            <label for="invoice-value">Invoice Value (optional)</label>
            <input type="number" id="invoice-value" name="Invoice Value (optional)" placeholder="e.g. 5000" min="0">
        </div>

        <button type="submit" class="button-save" id="save-button">SAVE</button>
        <div class="loading-spinner" id="loading-spinner"></div>
    </form>
    
    <div id="sync-error" class="sync-error">Sync failed: 1 entries remaining. Will retry.</div>
    <div id="success-message" class="success-message">Entry Saved Successfully!</div>

</div>

<script>
    // ⚠️ আপনার Apps Script ওয়েব অ্যাপের URL এখানে বসান
    const SCRIPT_URL = 'YOUR_DEPLOYMENT_URL_HERE'; 
    const DB_NAME = 'GB23_CollectionDB';
    const STORE_NAME = 'pending_entries';

    let db;
    
    // =========================================================================
    // I. IndexedDB setup for Offline Sync
    // =========================================================================

    function openDB() {
        return new Promise((resolve, reject) => {
            const request = indexedDB.open(DB_NAME, 1);
            
            request.onupgradeneeded = (event) => {
                db = event.target.result;
                db.createObjectStore(STORE_NAME, { keyPath: 'timestamp' });
            };
            
            request.onsuccess = (event) => {
                db = event.target.result;
                console.log('IndexedDB opened successfully');
                resolve(db);
            };
            
            request.onerror = (event) => {
                console.error('IndexedDB error:', event.target.errorCode);
                reject(event.target.error);
            };
        });
    }

    // ডেটা IndexedDB-তে সেভ করা
    function saveEntryLocally(entry) {
        return new Promise((resolve, reject) => {
            const transaction = db.transaction([STORE_NAME], 'readwrite');
            const store = transaction.objectStore(STORE_NAME);
            
            const request = store.add(entry);
            
            request.onsuccess = () => resolve();
            request.onerror = (event) => reject(event.target.error);
        });
    }

    // সমস্ত পেন্ডিং ডেটা লোড করা
    function getAllPendingEntries() {
        return new Promise((resolve, reject) => {
            const transaction = db.transaction([STORE_NAME], 'readonly');
            const store = transaction.objectStore(STORE_NAME);
            const request = store.getAll();
            
            request.onsuccess = (event) => resolve(event.target.result);
            request.onerror = (event) => reject(event.target.error);
        });
    }

    // সফলভাবে সিঙ্ক হওয়া ডেটা ডিলিট করা
    function deleteEntry(timestamp) {
        return new Promise((resolve, reject) => {
            const transaction = db.transaction([STORE_NAME], 'readwrite');
            const store = transaction.objectStore(STORE_NAME);
            const request = store.delete(timestamp);
            
            request.onsuccess = () => resolve();
            request.onerror = (event) => reject(event.target.error);
        });
    }

    // =========================================================================
    // II. Sync Logic (Data submission to Apps Script)
    // =========================================================================

    // Apps Script-এ ডেটা জমা দেওয়া
    async function submitEntryToScript(entry) {
        const payload = JSON.stringify(entry);
        try {
            const response = await fetch(SCRIPT_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: `postData=${encodeURIComponent(payload)}`
            });

            const result = await response.json();
            if (result.result === 'success') {
                return true;
            } else {
                console.error('Script Error:', result.message);
                return false;
            }
        } catch (error) {
            console.error('Network Error:', error);
            // নেটওয়ার্ক ফেইল করলে বা অন্য কোনো এরর হলে
            return false;
        }
    }

    // পেন্ডিং ডেটা সিঙ্ক্রোনাইজ করা
    async function syncData() {
        if (!navigator.onLine || !db) {
            updateStatus();
            return;
        }

        const entries = await getAllPendingEntries();
        if (entries.length === 0) {
            updateStatus();
            return;
        }

        document.getElementById('sync-error').style.display = 'block';
        document.getElementById('sync-error').textContent = `Syncing ${entries.length} entries...`;

        let successCount = 0;
        let failureCount = 0;

        for (const entry of entries) {
            const success = await submitEntryToScript(entry);
            if (success) {
                await deleteEntry(entry.timestamp);
                successCount++;
            } else {
                failureCount++;
            }
        }

        if (successCount > 0 && failureCount === 0) {
            // সবগুলো সফলভাবে সিঙ্ক হলে
            document.getElementById('sync-error').style.display = 'none';
        } else if (failureCount > 0) {
            // কিছু ফেইল হলে বা বাকি থাকলে
             document.getElementById('sync-error').textContent = `Sync failed: ${failureCount} entries remaining. Will retry.`;
        }
        
        updateStatus();
    }


    // =========================================================================
    // III. UI and Event Handlers
    // =========================================================================

    // স্ট্যাটাস আপডেট করা (অনলাইন/অফলাইন ও পেন্ডিং কাউন্ট)
    async function updateStatus() {
        const isOnline = navigator.onLine;
        const onlineStatus = document.getElementById('online-status');
        const pendingStatus = document.getElementById('pending-sync-status');
        const errorBar = document.getElementById('sync-error');
        
        onlineStatus.textContent = isOnline ? 'অনলাইনে আছেন' : 'অফলাইনে আছেন';
        onlineStatus.style.color = isOnline ? 'green' : 'red';
        
        // Pending Count আপডেট করা
        if (db) {
            const entries = await getAllPendingEntries();
            const count = entries.length;
            pendingStatus.textContent = `Pending Sync: ${count}`;
            pendingStatus.style.display = count > 0 ? 'block' : 'none';
            
            if (count === 0) {
                 errorBar.style.display = 'none';
            } else if (isOnline) {
                 // অনলাইনে থেকে সিঙ্ক ফেইল দেখালে 
                 errorBar.style.display = 'block';
                 errorBar.textContent = `Sync failed: ${count} entries remaining. Will retry.`;
            }
        }
    }

    // কাস্টমার লিস্ট লোড করা
    async function loadCustomerList() {
        try {
            const response = await fetch(SCRIPT_URL + '?action=getCustomers');
            const customers = await response.json();
            const datalist = document.getElementById('customer-list');
            datalist.innerHTML = '';
            customers.forEach(customer => {
                const option = document.createElement('option');
                option.value = customer;
                datalist.appendChild(option);
            });
        } catch (e) {
            console.error('Failed to load customer list:', e);
        }
    }

    // ফর্ম সাবমিট হ্যান্ডলার
    document.getElementById('collection-form').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const saveButton = document.getElementById('save-button');
        const spinner = document.getElementById('loading-spinner');
        const successMessage = document.getElementById('success-message');
        
        saveButton.style.display = 'none';
        spinner.style.display = 'block';
        successMessage.style.display = 'none';

        // ডেটা সংগ্রহ করা
        const formData = new FormData(this);
        const entry = {};
        for (const [key, value] of formData.entries()) {
            entry[key] = value;
        }
        entry.timestamp = Date.now(); // ইউনিক কী হিসেবে ব্যবহার করা হবে
        entry.Submission_Date = new Date().toISOString().split('T')[0];
        
        // সিঙ্ক করার চেষ্টা 
        let isSyncSuccess = false;
        
        if (navigator.onLine) {
            isSyncSuccess = await submitEntryToScript(entry);
        }

        if (!navigator.onLine || !isSyncSuccess) {
            // অফলাইন বা সিঙ্ক ফেইল হলে লোকালি সেভ করা
            await saveEntryLocally(entry);
            await updateStatus();
            if (!navigator.onLine) {
                 alert("অফলাইন মোডে ডেটা লোকালি সেভ করা হয়েছে। অনলাইন হলে স্বয়ংক্রিয়ভাবে সিঙ্ক হবে।");
            } else {
                 alert("সার্ভার/Apps Script এ ত্রুটি হয়েছে, ডেটা লোকালি সেভ করা হলো।");
            }
        }

        // ফর্ম রিসেট
        this.reset();
        document.getElementById('submission-date').value = new Date().toISOString().split('T')[0];
        
        saveButton.style.display = 'block';
        spinner.style.display = 'none';
        
        if (isSyncSuccess) {
            successMessage.style.display = 'block';
            setTimeout(() => { successMessage.style.display = 'none'; }, 3000);
        }

        // সিঙ্কের চেষ্টা আবার শুরু করা
        syncData();
    });

    // =========================================================================
    // IV. Initialization and Setup
    // =========================================================================

    async function init() {
        // আজকের তারিখ সেট করা
        document.getElementById('submission-date').value = new Date().toISOString().split('T')[0];
        
        // IndexedDB খোলা এবং স্ট্যাটাস আপডেট করা
        await openDB();
        
        // কাস্টমার লিস্ট লোড করা
        loadCustomerList();
        
        // প্রাথমিক স্ট্যাটাস আপডেট করা
        updateStatus();
        
        // প্রতি ৩০ সেকেন্ডে সিঙ্ক করার চেষ্টা
        setInterval(syncData, 30000);

        // অনলাইন/অফলাইন ইভেন্ট লিসেনার
        window.addEventListener('online', () => {
             updateStatus();
             syncData(); // অনলাইন হলেই সিঙ্ক শুরু
        });
        window.addEventListener('offline', updateStatus);

        // অ্যাপ লোড হওয়ার সাথে সাথেই সিঙ্ক করার চেষ্টা
        syncData();
    }

    init();

</script>
</body>
</html>

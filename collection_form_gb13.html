<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GB-13 Daily Collection Entry</title>    
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --primary-color: #007bff;
            --primary-dark: #0056b3;
            --background-color: #e9ecef;
            --card-background: #ffffff;
            --text-color: #343a40;
            --success-color: #28a745;
            --warning-color: #ffc107;
            --danger-color: #dc3545;
        }

        body { font-family: 'Roboto', sans-serif; padding: 20px; background-color: var(--background-color); }
        .container { max-width: 400px; margin: auto; background: var(--card-background); padding: 30px; border-radius: 12px; box-shadow: 0 8px 25px rgba(0,0,0,0.1); }
        h1 { color: var(--primary-color); text-align: center; margin-bottom: 30px; font-size: 1.6em; font-weight: 700; }
        label { display: block; margin-top: 15px; margin-bottom: 5px; font-weight: 600; color: var(--text-color); }
        input { width: 100%; padding: 14px; border: 1px solid #ced4da; border-radius: 8px; box-sizing: border-box; transition: 0.3s; }
        input:focus { border-color: var(--primary-color); outline: none; box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.25); }
        .button-wrapper { display: flex; justify-content: center; margin-top: 30px; }
        button { background-color: var(--primary-color); color: white; padding: 15px; border: none; border-radius: 50%; cursor: pointer; width: 80px; height: 80px; font-weight: bold; box-shadow: 0 4px 10px rgba(0, 123, 255, 0.3); transition: 0.3s; }
        button:hover { background-color: var(--primary-dark); transform: scale(1.05); }
        #statusMessage { margin-top: 20px; padding: 12px; border-radius: 6px; font-weight: bold; text-align: center; }
        .network-info { margin-bottom: 15px; text-align: center; }
        .offline-badge { background-color: var(--danger-color); color: white; padding: 5px 8px; border-radius: 5px; font-size: 0.9em; }
        .back-button { display: block; margin-bottom: 25px; text-decoration: none; color: var(--primary-color); font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <a href="daily_collection_entry.html" class="back-button">← Details Page এ ফিরে যান</a>
        <h1>💰 GB-13 Collection</h1>
        
        <div id="networkStatus" class="network-info"></div>
        
        <form id="collectionForm">
            <label for="customerName">Client/Customer Name</label>
            <input type="text" id="customerName" name="Client/Customer Name" list="customer-list-gb13" placeholder="নাম সিলেক্ট করুন" required>
            
            <datalist id="customer-list-gb13">
                <option value="Rahman pharmacy">
                <option value="Jannati medicine Hall">
                <option value="gaibandha clinic">
                <option value="Daymohi pharmacy">
                <option value="Habib medical hall">
                <option value="Rahi pharmacy">
                <option value="ma pharmacy">
                <option value="Ideal pharmacy">
                <option value="Majnu medical hall">
                <option value="Maa medical hall">
                <option value="Raounok medical hall">
                <option value="Lotfor pharmacy">
                <option value="Afsana Medical Store">
                <option value="dipto Medical Store">
                <option value="Maya pharmacy">
                <option value="siyam pharmacy">
                <option value="jibon pharmacy">
                <option value="vai-bon pharmacy">
                <option value="jhorna pharmacy">
                <option value="rahmania pharmacy">
                <option value="M/S Hassan pharmacy">
                <option value="Mondal pharmacy mather hat">
                <option value="Mondal pharmacy traffic mor">
                <option value="Shepon Medical Store">
                <option value="City pharmacy">
                <option value="sharmin pharmacy">
                <option value="Saha trading">
                <option value="Turin Medical Store">
                <option value="maa baba pharmacy">
            </datalist>

            <label for="paymentReceived">Payment Received (Taka)</label>
            <input type="number" id="paymentReceived" name="Payment Received (Taka)" placeholder="e.g. 3000" required>

            <label for="invoiceValue">Invoice Value (optional)</label>
            <input type="number" id="invoiceValue" name="Invoice Value (optional)" placeholder="e.g. 5000">

            <div class="button-wrapper">
                <button type="submit" id="submitButton">SAVE</button>
            </div>
            <p id="statusMessage"></p>
        </form>
    </div>

    <script>
        // আপনার দেওয়া GB-13 Apps Script URL
        const GOOGLE_SHEET_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwzV7mFEcKO8qra7fQWD91F7NoipI40LmywgZih1zySUIIHRCBSUE-MlaXeWuPFxjdvYQ/exec";
        const OFFLINE_STORAGE_KEY = 'offlineSubmissions_GB13';

        function updateStatus() {
            const status = document.getElementById('networkStatus');
            const btn = document.getElementById('submitButton');
            if (!navigator.onLine) {
                status.innerHTML = '<span class="offline-badge">অফলাইন মোড</span>';
                btn.textContent = 'OFFLINE';
                btn.style.backgroundColor = 'var(--danger-color)';
            } else {
                status.innerHTML = '';
                btn.textContent = 'SAVE';
                btn.style.backgroundColor = 'var(--primary-color)';
                syncData(); 
            }
        }

        document.getElementById('collectionForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const msg = document.getElementById('statusMessage');
            const btn = document.getElementById('submitButton');
            
            const formData = new FormData(this);
            const data = {};
            formData.forEach((v, k) => data[k] = v);
            if (!data['Invoice Value (optional)']) data['Invoice Value (optional)'] = 0;
            data['Group'] = 'gb-13'; // গ্রুপ নাম নিশ্চিত করা হয়েছে

            btn.disabled = true;
            msg.textContent = "Saving... ✅"; 
            msg.style.color = "blue";

            if (navigator.onLine) {
                fetch(GOOGLE_SHEET_WEB_APP_URL, { 
                    method: 'POST', 
                    mode: 'no-cors', 
                    body: JSON.stringify(data) 
                });
                
                setTimeout(() => {
                    msg.textContent = "Success! Data sent ✅";
                    msg.style.color = "green";
                    this.reset();
                    btn.disabled = false;
                }, 500); 

            } else {
                saveOffline(data);
                this.reset();
                btn.disabled = false;
            }
        });

        function saveOffline(data) {
            const submissions = JSON.parse(localStorage.getItem(OFFLINE_STORAGE_KEY) || '[]');
            submissions.push(data);
            localStorage.setItem(OFFLINE_STORAGE_KEY, JSON.stringify(submissions));
            document.getElementById('statusMessage').textContent = "অফলাইনে সেভ হয়েছে! ইন্টারনেট পেলে অটো সিঙ্ক হবে।";
            document.getElementById('statusMessage').style.color = "orange";
        }

        async function syncData() {
            const submissions = JSON.parse(localStorage.getItem(OFFLINE_STORAGE_KEY) || '[]');
            if (submissions.length === 0) return;
            
            for (let i = 0; i < submissions.length; i++) {
                try {
                    await fetch(GOOGLE_SHEET_WEB_APP_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(submissions[i]) });
                } catch (e) { break; }
            }
            localStorage.removeItem(OFFLINE_STORAGE_KEY);
            document.getElementById('statusMessage').textContent = "সব অফলাইন ডেটা সিঙ্ক হয়েছে! ✅";
            document.getElementById('statusMessage').style.color = "green";
        }

        window.addEventListener('online', updateStatus);
        window.addEventListener('offline', updateStatus);
        document.addEventListener('DOMContentLoaded', updateStatus);
    </script>
</body>
</html>
